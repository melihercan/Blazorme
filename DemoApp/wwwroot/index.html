    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // https://github.com/rafrex/spa-github-pages - MIT, (c) 2016 Rafael Pedicini.
        // Decodes the ?p= query that 404.html produces, so a deep link such as
        // /streamsaverdemo survives a hard refresh on GitHub Pages. Inert everywhere else:
        // without a ?p= parameter this does nothing at all.
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
